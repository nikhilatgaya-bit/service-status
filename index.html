<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claim Status</title>
<style>
  :root { --ink:#1d2433; --muted:#5d6676; --line:#dfe3ea; --bg:#f4f6f9; --card:#fff; --accent:#1f5fae; --ok:#1d7a46; --warn:#b4570b; --bad:#b42318; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif; background:var(--bg); color:var(--ink); }
  .wrap { max-width:520px; margin:0 auto; padding:16px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:8px 0 16px; }
  h1 { font-size:20px; margin:0; }
  .shop { color:var(--muted); font-size:14px; margin-top:2px; }
  .lang { display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; flex:none; }
  .lang button { border:0; background:#fff; padding:7px 12px; font-size:14px; cursor:pointer; color:var(--ink); }
  .lang button.on { background:var(--accent); color:#fff; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; }
  label { display:block; font-size:14px; font-weight:600; margin:0 0 6px; }
  input { width:100%; font-size:17px; padding:11px 12px; border:1px solid #c5ccd8; border-radius:8px; margin-bottom:14px; }
  input:focus { outline:2px solid var(--accent); border-color:transparent; }
  .go { width:100%; font-size:17px; padding:12px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
  .go:disabled { opacity:.6; cursor:default; }
  .msg { padding:12px 14px; border-radius:8px; font-size:15px; margin-bottom:14px; }
  .msg.bad { background:#fdecea; color:var(--bad); }
  .stage { font-size:18px; font-weight:700; margin:0 0 4px; }
  .stage.ok { color:var(--ok); } .stage.warn { color:var(--warn); } .stage.wait { color:var(--accent); }
  .sub { color:var(--muted); font-size:14px; margin:0 0 14px; }
  .or { display:flex; align-items:center; gap:10px; color:var(--muted); font-size:13px; font-weight:600; margin:-4px 0 10px; }
  .or::before, .or::after { content:""; flex:1; height:1px; background:var(--line); }
  .hint { color:var(--muted); font-size:13px; margin:-8px 0 14px; }
  .req { color:var(--bad); }
  dl.det { display:grid; grid-template-columns:auto 1fr; gap:6px 14px; margin:0 0 16px; padding:12px 14px; background:#f7f9fc; border:1px solid var(--line); border-radius:8px; font-size:14px; }
  dl.det dt { color:var(--muted); }
  dl.det dd { margin:0; font-weight:600; word-break:break-all; }
  .count { color:var(--muted); font-size:14px; margin:0 0 10px; }
  ol.tl { list-style:none; margin:0; padding:0; }
  ol.tl li { position:relative; padding:0 0 16px 28px; }
  ol.tl li::before { content:""; position:absolute; left:6px; top:5px; width:12px; height:12px; border-radius:50%; background:var(--accent); }
  ol.tl li::after { content:""; position:absolute; left:11px; top:19px; bottom:0; width:2px; background:var(--line); }
  ol.tl li:last-child { padding-bottom:0; } ol.tl li:last-child::after { display:none; }
  ol.tl li.last::before { background:var(--ok); box-shadow:0 0 0 4px #d8efe1; }
  .tl-t { font-weight:600; font-size:15px; } .tl-d { color:var(--muted); font-size:13px; }
  .help { text-align:center; font-size:15px; color:var(--muted); }
  .help a { color:var(--accent); font-weight:600; text-decoration:none; }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1 data-t="title"></h1><div class="shop" id="shopName"></div></div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en">English</button>
      <button type="button" data-lang="hi">हिन्दी</button>
    </div>
  </header>

  <form class="card" id="form" autocomplete="on">
    <label for="job" data-t="job"></label>
    <input id="job" name="job" inputmode="text" autocapitalize="characters" placeholder="SR_1234">
    <div class="or" data-t="or"></div>
    <label for="serial" data-t="serial"></label>
    <input id="serial" name="serial" inputmode="text" autocapitalize="characters" autocomplete="off" placeholder="">
    <p class="hint" data-t="hint"></p>
    <label for="mobile"><span data-t="mobile"></span> <span class="req">*</span></label>
    <input id="mobile" name="mobile" type="tel" inputmode="numeric" maxlength="14" placeholder="98XXXXXXXX">
    <div class="msg bad hidden" id="err"></div>
    <button class="go" id="go" type="submit" data-t="check"></button>
  </form>

  <div class="hidden" id="result"></div>

  <p class="help hidden" id="help"><span data-t="help"></span> <a id="phone" href="#"></a></p>
</div>

<script>
var LOOKUP_URL = 'https://script.google.com/macros/s/AKfycbwwxFvFelBGOpDmXjIxTw408k7IBIMwG3dmNwRXJIpci-yjmj4dAuUZs1gGJsqtAkJJcQ/exec';

var T = {
  en: {
    title: 'Claim Status', job: 'Job ID', serial: 'Claim battery serial number', or: 'OR', mobile: 'Registered mobile number', check: 'Check status', checking: 'Checking…',
    hint: 'Enter the Job ID from your slip, or the serial number of the battery you gave for claim.',
    help: 'For help, call', d_job: 'Job ID', d_date: 'Claim date', d_brand: 'Brand', d_model: 'Battery model', d_serial: 'Battery serial no.', d_status: 'Current status',
    found: 'Claims found for this battery: ',
    e_need: 'Please enter the Job ID or the claim battery serial number.',
    e_serial: 'Please enter the full serial number printed on the battery.',
    e_format: 'Please enter the Job ID as printed on your slip, for example SR_1234.',
    e_mobile: 'Please enter the 10-digit mobile number given at the counter.',
    e_nomatch: 'No claim found for these details. Please check the Job ID / serial number and mobile number.', e_left: 'Tries left: ',
    e_locked: 'Too many wrong tries. Please try again after one hour.',
    e_server: 'Could not check right now. Please try again in a minute.',
    s_received: 'Claim received', s_stock: 'Replacement battery given', s_sent: 'Sent to company',
    s_back: 'Battery received from company', s_ready: 'Ready for pickup', s_collected: 'Handed over to customer',
    s_rejected: 'Claim not accepted by company',
    g_checking: 'Under checking', g_checkingSub: 'Your battery is being checked at our service centre.',
    g_stockHere: 'Replacement given', g_stockHereSub: 'You have received a replacement battery. Your old battery will be sent to the company.',
    g_stockSent: 'Replacement given', g_stockSentSub: 'You have received a replacement battery. Your old battery has been sent to the company.',
    g_atCompany: 'At company', g_atCompanySub: 'Your battery has been sent to the company. We will inform you when it comes back.',
    g_readyPickup: 'Ready for pickup', g_readyPickupSub: 'Please visit our service centre with your slip to collect your battery.',
    g_collected: 'Completed', g_collectedSub: 'Your battery has been handed over. Thank you.',
    g_done: 'Completed', g_doneSub: 'This claim is complete. Thank you.',
    g_rejectedCollect: 'Claim not accepted – please collect your battery', g_rejectedCollectSub: 'The company did not accept this claim. Please visit us with your slip to collect your battery.',
    g_rejectedDone: 'Claim not accepted', g_rejectedDoneSub: 'The battery has been returned to the customer.'
  },
  hi: {
    title: 'क्लेम की स्थिति', job: 'जॉब आईडी', serial: 'क्लेम बैटरी का सीरियल नंबर', or: 'या', mobile: 'पंजीकृत मोबाइल नंबर', check: 'स्थिति देखें', checking: 'जाँच हो रही है…',
    hint: 'पर्ची पर लिखी जॉब आईडी डालें, या क्लेम में दी गई बैटरी का सीरियल नंबर डालें।',
    help: 'सहायता के लिए कॉल करें', d_job: 'जॉब आईडी', d_date: 'क्लेम की तारीख', d_brand: 'ब्रांड', d_model: 'बैटरी मॉडल', d_serial: 'बैटरी सीरियल नंबर', d_status: 'वर्तमान स्थिति',
    found: 'इस बैटरी के मिले क्लेम: ',
    e_need: 'कृपया जॉब आईडी या क्लेम बैटरी का सीरियल नंबर डालें।',
    e_serial: 'कृपया बैटरी पर छपा पूरा सीरियल नंबर डालें।',
    e_format: 'कृपया पर्ची पर छपी जॉब आईडी लिखें, जैसे SR_1234।',
    e_mobile: 'कृपया काउंटर पर दिया गया 10 अंकों का मोबाइल नंबर लिखें।',
    e_nomatch: 'इन विवरणों से कोई क्लेम नहीं मिला। कृपया जॉब आईडी / सीरियल नंबर और मोबाइल नंबर जाँचें।', e_left: 'बचे हुए प्रयास: ',
    e_locked: 'बहुत अधिक गलत प्रयास। कृपया एक घंटे बाद फिर से प्रयास करें।',
    e_server: 'अभी स्थिति नहीं देखी जा सकी। कृपया एक मिनट बाद फिर से प्रयास करें।',
    s_received: 'क्लेम प्राप्त हुआ', s_stock: 'बदले में बैटरी दी गई', s_sent: 'कंपनी को भेजा गया',
    s_back: 'कंपनी से बैटरी प्राप्त हुई', s_ready: 'ले जाने के लिए तैयार', s_collected: 'बैटरी ग्राहक को सौंप दी गई',
    s_rejected: 'कंपनी ने क्लेम स्वीकार नहीं किया',
    g_checking: 'जाँच चल रही है', g_checkingSub: 'आपकी बैटरी की जाँच हमारे सर्विस सेंटर पर हो रही है।',
    g_stockHere: 'बदले में बैटरी दी गई', g_stockHereSub: 'आपको बदले में बैटरी मिल चुकी है। आपकी पुरानी बैटरी कंपनी को भेजी जाएगी।',
    g_stockSent: 'बदले में बैटरी दी गई', g_stockSentSub: 'आपको बदले में बैटरी मिल चुकी है। आपकी पुरानी बैटरी कंपनी को भेज दी गई है।',
    g_atCompany: 'कंपनी में', g_atCompanySub: 'आपकी बैटरी कंपनी को भेजी गई है। वापस आने पर हम आपको सूचित करेंगे।',
    g_readyPickup: 'ले जाने के लिए तैयार', g_readyPickupSub: 'कृपया अपनी पर्ची के साथ सर्विस सेंटर आकर अपनी बैटरी ले जाएँ।',
    g_collected: 'पूरा हुआ', g_collectedSub: 'आपकी बैटरी आपको सौंप दी गई है। धन्यवाद।',
    g_done: 'पूरा हुआ', g_doneSub: 'यह क्लेम पूरा हो गया है। धन्यवाद।',
    g_rejectedCollect: 'क्लेम अस्वीकार हुआ – कृपया अपनी बैटरी ले जाएँ', g_rejectedCollectSub: 'कंपनी ने यह क्लेम स्वीकार नहीं किया। कृपया पर्ची के साथ आकर अपनी बैटरी ले जाएँ।',
    g_rejectedDone: 'क्लेम अस्वीकार हुआ', g_rejectedDoneSub: 'बैटरी ग्राहक को लौटा दी गई है।'
  }
};
var STAGE_TONE = { checking:'wait', stockHere:'ok', stockSent:'ok', atCompany:'wait', readyPickup:'ok', collected:'ok', done:'ok', rejectedCollect:'warn', rejectedDone:'warn' };

var lang = 'en', last = null, lastErr = null;
function $(id) { return document.getElementById(id); }
function t(k) { return (T[lang] && T[lang][k]) || T.en[k] || k; }

function setLang(l) {
  lang = T[l] ? l : 'en';
  try { localStorage.setItem('statusLang', lang); } catch (e) {}
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-lang]').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-lang') === lang); });
  document.querySelectorAll('[data-t]').forEach(function (el) { el.textContent = t(el.getAttribute('data-t')); });
  if (last) showResult(last);
  if (lastErr) showError(lastErr.code, lastErr.left);
}

function showError(code, left) {
  lastErr = { code: code, left: left };
  var m = t('e_' + code);
  if (code === 'nomatch' && left !== undefined && left !== null) m += ' ' + t('e_left') + left;
  $('err').textContent = m;
  $('err').classList.remove('hidden');
}
function clearError() { lastErr = null; $('err').classList.add('hidden'); }

function el(tag, cls, text) {
  var x = document.createElement(tag);
  if (cls) x.className = cls;
  if (text !== undefined && text !== null) x.textContent = text;
  return x;
}

function claimCard(c) {
  var g = c.stage || 'checking';
  var card = el('div', 'card');
  card.appendChild(el('p', 'stage ' + (STAGE_TONE[g] || 'wait'), t('g_' + g)));
  card.appendChild(el('p', 'sub', t('g_' + g + 'Sub')));
  var dl = el('dl', 'det');
  [['d_job', c.job], ['d_date', c.claimDate], ['d_brand', c.brand], ['d_model', c.model], ['d_serial', c.serial], ['d_status', t('g_' + g)]].forEach(function (p) {
    if (!p[1]) return;
    dl.appendChild(el('dt', '', t(p[0])));
    dl.appendChild(el('dd', '', p[1]));
  });
  card.appendChild(dl);
  var ol = el('ol', 'tl');
  (c.steps || []).forEach(function (s, i, all) {
    var li = el('li', i === all.length - 1 ? 'last' : '');
    li.appendChild(el('div', 'tl-t', t('s_' + s.key)));
    li.appendChild(el('div', 'tl-d', s.date || ''));
    ol.appendChild(li);
  });
  card.appendChild(ol);
  return card;
}

function showResult(r) {
  last = r;
  var list = r.results || [r];
  var box = $('result');
  box.innerHTML = '';
  if (list.length > 1) box.appendChild(el('p', 'count', t('found') + list.length));
  list.forEach(function (c) { box.appendChild(claimCard(c)); });
  box.classList.remove('hidden');
}

function api(params) {
  var q = Object.keys(params).map(function (k) { return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]); }).join('&');
  return fetch(LOOKUP_URL + (LOOKUP_URL.indexOf('?') < 0 ? '?' : '&') + q, { method: 'GET', redirect: 'follow' })
    .then(function (res) { if (!res.ok) throw new Error('http'); return res.json(); });
}

function check(ev) {
  if (ev) ev.preventDefault();
  clearError();
  var job = $('job').value.trim().toUpperCase().replace(/\s+/g, '');
  var serial = $('serial').value.trim().toUpperCase();
  var mob = $('mobile').value.replace(/\D/g, '');
  if (/^\d+$/.test(job)) job = 'SR_' + job;
  $('job').value = job;
  $('serial').value = serial;
  if (!job && !serial) { showError('need'); return; }
  if (job && !/^SR_\d{1,7}$/.test(job)) { showError('format'); return; }
  if (serial && serial.replace(/[^A-Z0-9]/g, '').length < 4) { showError('serial'); return; }
  if (mob.length < 10) { showError('mobile'); return; }
  $('go').disabled = true; $('go').textContent = t('checking');
  $('result').classList.add('hidden'); last = null;
  var q = { mobile: mob };
  if (job) q.job = job;
  if (serial) q.serial = serial;
  api(q).then(function (r) {
    if (r && r.ok) showResult(r); else showError((r && r.error) || 'server', r && r.left);
  }).catch(function () { showError('server'); })
    .then(function () { $('go').disabled = false; $('go').textContent = t('check'); });
}

function loadShop() {
  api({ info: 1 }).then(function (r) {
    if (!r || !r.ok) return;
    if (r.shopName) { $('shopName').textContent = r.shopName; document.title = r.shopName + ' – ' + t('title'); }
    if (r.phone) { $('phone').textContent = r.phone; $('phone').href = 'tel:' + r.phone.replace(/[^\d+]/g, ''); $('help').classList.remove('hidden'); }
  }).catch(function () {});
}

document.querySelectorAll('[data-lang]').forEach(function (b) { b.addEventListener('click', function () { setLang(b.getAttribute('data-lang')); }); });
$('form').addEventListener('submit', check);
(function init() {
  var saved = null;
  try { saved = localStorage.getItem('statusLang'); } catch (e) {}
  var qs = new URLSearchParams(location.search);
  setLang(qs.get('lang') || saved || 'en');
  if (qs.get('job')) $('job').value = qs.get('job').toUpperCase();
  if (qs.get('serial')) $('serial').value = qs.get('serial').toUpperCase();
  (qs.get('job') || qs.get('serial') ? $('mobile') : $('job')).focus();
  loadShop();
})();
</script>
</body>
</html>
